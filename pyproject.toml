[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wool"
version = "0.0.1"
requires-python = ">=3.10"
description = "Pure Python configuration management library."
readme = "README.rst"
authors = [
  {name = "Steven Kryskalla", email = "skryskalla@gmail.com"}
]
maintainers = [
  {name = "Steven Kryskalla", email = "skryskalla@gmail.com"}
]
classifiers = [

]
license = {text = "MIT"}
dependencies = []

[dependency-groups]
dev = [
    "coverage<7.7",
    "pytest<8.4",
    "pytest-cov==6.0.0",
    "black<26.0",
    "pylint<3.4",
    "flake8<7.2",
    "mypy<1.16.0",
    "pyrefly==1.0.0",
    "ruff==0.14.14",
]

[project.urls]

bugs = "https://github.com/lost-theory/wool/issues"
homepage = "https://github.com/lost-theory/wool"

[tool.setuptools]
package-dir = {"" = "wool"}

[tool.setuptools.package-data]
"*" = ["*.*"]


[tool.black]
line-length = 200
preview = 1

[tool.pylint]
max-line-length = 200
disable = ["missing-function-docstring", "missing-class-docstring", "too-few-public-methods", "too-many-arguments", "too-many-positional-arguments", "unspecified-encoding", "use-dict-literal", "fixme"]

[tool.mypy]
files = "."
strict = true
warn_unreachable = true
warn_no_return = true

#[[tool.mypy.overrides]]
## Don't require test functions to include types
#module = "tests.*"
#allow_untyped_defs = true
#disable_error_code = "attr-defined"
