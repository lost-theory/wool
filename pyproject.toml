[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uninfra"
version = "0.0.1"
description = "Pure Python configuration management."
readme = "README.rst"
authors = [
  {name = "Steven Kryskalla", email = "skryskalla@gmail.com"}
]
maintainers = [
  {name = "Steven Kryskalla", email = "skryskalla@gmail.com"}
]
classifiers = [

]
license = {text = "GNU General Public License v3"}
dependencies = [
  
]

[project.optional-dependencies]
dev = []

[project.urls]

bugs = "https://github.com/lost-theory/uninfra/issues"
homepage = "https://github.com/lost-theory/uninfra"

[tool.setuptools]
package-dir = {"" = "uninfra"}

[tool.setuptools.package-data]
"*" = ["*.*"]


[tool.black]
line-length = 200
preview = 1


# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"
